# cloud-boot/iso — multi-arch bootable ISO assembler + QEMU/EDK2 boot harness.
#
# Run `task -l` to list tasks. Variables on the CLI, e.g.
#   task iso:multiarch MULTI_ISO=out.iso \
#                      EFI_AMD64=../tamago-uefi/BOOTX64.EFI \
#                      EFI_ARM64=../tamago-uefi/BOOTAA64.EFI
#
# The default inputs assume cloud-boot/tamago-uefi has built its four
# per-arch BOOT<arch>.EFI binaries. Override per-EFI vars to point at
# other binaries (e.g. UKIs built by cloud-boot/uki).

version: '3'

vars:
  GO: '{{.GO | default "go"}}'

tasks:

  default:
    desc: Build the cloud-boot-iso CLI
    deps: [build]

  tidy:
    desc: go mod tidy
    cmds:
      - '{{.GO}} mod tidy'

  build:
    desc: Build the cloud-boot-iso CLI
    deps: [tidy]
    cmds:
      - mkdir -p bin
      - '{{.GO}} build -trimpath -o bin/cloud-boot-iso ./cmd/cloud-boot-iso'
    sources:
      - go.mod
      - go.sum
      - cmd/cloud-boot-iso/**/*.go
      - pkg/**/*.go
    generates:
      - bin/cloud-boot-iso

  vet:
    desc: go vet
    cmds:
      - '{{.GO}} vet ./...'

  test:
    desc: Run unit tests
    cmds:
      - '{{.GO}} test ./...'

  cover:
    desc: Print test coverage per package
    cmds:
      - '{{.GO}} test -cover ./...'

  # iso:multiarch — assemble ONE multi-arch boot.iso from four already
  # built per-arch BOOT<arch>.EFI binaries (typically the
  # cloud-boot/tamago-uefi outputs sitting in ../tamago-uefi/). The
  # resulting ISO carries \EFI\BOOT\BOOTX64.EFI, \EFI\BOOT\BOOTAA64.EFI,
  # \EFI\BOOT\BOOTLOONGARCH64.EFI and \EFI\BOOT\BOOTRISCV64.EFI in the
  # same ESP — UEFI firmware on each CPU reads only its own arch's
  # file, so the same ISO boots on all four.
  iso:multiarch:
    desc: 'Assemble a 4-arch boot.iso from per-arch BOOT<arch>.EFI inputs.'
    deps: [build]
    vars:
      MULTI_ISO: '{{.MULTI_ISO | default "boot-multi.iso"}}'
      EFI_AMD64:   '{{.EFI_AMD64   | default "../tamago-uefi/BOOTX64.EFI"}}'
      EFI_ARM64:   '{{.EFI_ARM64   | default "../tamago-uefi/BOOTAA64.EFI"}}'
      EFI_LOONG64: '{{.EFI_LOONG64 | default "../tamago-uefi/BOOTLOONGARCH64.EFI"}}'
      EFI_RISCV64: '{{.EFI_RISCV64 | default "../tamago-uefi/BOOTRISCV64.EFI"}}'
    preconditions:
      - sh: 'test -f "{{.EFI_AMD64}}"'
        msg: 'BOOTX64.EFI missing at {{.EFI_AMD64}} (override with EFI_AMD64=<path>)'
      - sh: 'test -f "{{.EFI_ARM64}}"'
        msg: 'BOOTAA64.EFI missing at {{.EFI_ARM64}} (override with EFI_ARM64=<path>)'
      - sh: 'test -f "{{.EFI_LOONG64}}"'
        msg: 'BOOTLOONGARCH64.EFI missing at {{.EFI_LOONG64}} (override with EFI_LOONG64=<path>)'
      - sh: 'test -f "{{.EFI_RISCV64}}"'
        msg: 'BOOTRISCV64.EFI missing at {{.EFI_RISCV64}} (override with EFI_RISCV64=<path>)'
    cmds:
      - >-
        ./bin/cloud-boot-iso
        --uki linux/amd64={{.EFI_AMD64}}
        --uki linux/arm64={{.EFI_ARM64}}
        --uki linux/loongarch64={{.EFI_LOONG64}}
        --uki linux/riscv64={{.EFI_RISCV64}}
        --output {{.MULTI_ISO}}

  # test:multiarch:boot — boot the multi-arch ISO under
  # qemu-system-<arch> for each of {amd64, arm64, loongarch64,
  # riscv64}, with the matching EDK2 firmware. Pure-Go test driver
  # in pkg/multiarchboot (no shell harness — QEMU + OVMF are consumed
  # via the standard CLI).
  #
  # Each arch is skip-gated on the matching OVMF env var being set
  # AND pointing at a file that exists. The four envs default to
  # homebrew's qemu bottle on macOS (/opt/homebrew/Cellar/qemu/.../
  # edk2-*.fd) — override for other distros or to point at a fresher
  # EDK2 build.
  #
  # The amd64 + riscv64 firmware ports need a writable vars store
  # (set CLOUDBOOT_OVMF_<arch>_VARS); arm64 + loongarch64 boot via
  # -bios with code-only.
  test:multiarch:boot:
    desc: 'Boot the multi-arch ISO under qemu+EDK2 for each of amd64/arm64/loongarch64/riscv64.'
    vars:
      MULTI_ISO: '{{.MULTI_ISO | default "boot-multi.iso"}}'
      QEMU_EDK2_DIR: '{{.QEMU_EDK2_DIR | default "/opt/homebrew/Cellar/qemu/10.2.2/share/qemu"}}'
      BOOT_TIMEOUT: '{{.BOOT_TIMEOUT | default "60s"}}'
      # NOTE: a default value cannot itself contain a nested
      # `{{.QEMU_EDK2_DIR}}` — go-task does not re-template the literal
      # passed to `default`, so it would reach the test verbatim and
      # every arch would skip on a bogus path. Build the path with the
      # template `printf` instead, which evaluates .QEMU_EDK2_DIR.
      OVMF_AMD64_CODE:   '{{.OVMF_AMD64_CODE   | default (printf "%s/edk2-x86_64-code.fd" .QEMU_EDK2_DIR)}}'
      OVMF_AMD64_VARS:   '{{.OVMF_AMD64_VARS   | default (printf "%s/edk2-i386-vars.fd" .QEMU_EDK2_DIR)}}'
      OVMF_ARM64_CODE:   '{{.OVMF_ARM64_CODE   | default (printf "%s/edk2-aarch64-code.fd" .QEMU_EDK2_DIR)}}'
      OVMF_LOONG64_CODE: '{{.OVMF_LOONG64_CODE | default (printf "%s/edk2-loongarch64-code.fd" .QEMU_EDK2_DIR)}}'
      OVMF_RISCV64_CODE: '{{.OVMF_RISCV64_CODE | default (printf "%s/edk2-riscv-code.fd" .QEMU_EDK2_DIR)}}'
      OVMF_RISCV64_VARS: '{{.OVMF_RISCV64_VARS | default (printf "%s/edk2-riscv-vars.fd" .QEMU_EDK2_DIR)}}'
    preconditions:
      - sh: 'test -f "{{.MULTI_ISO}}"'
        msg: 'multi-arch ISO not found at {{.MULTI_ISO}} (run "task iso:multiarch" first)'
    env:
      CLOUDBOOT_TEST_ISO: '{{.MULTI_ISO}}'
      CLOUDBOOT_OVMF_AMD64_CODE:   '{{.OVMF_AMD64_CODE}}'
      CLOUDBOOT_OVMF_AMD64_VARS:   '{{.OVMF_AMD64_VARS}}'
      CLOUDBOOT_OVMF_ARM64_CODE:   '{{.OVMF_ARM64_CODE}}'
      CLOUDBOOT_OVMF_LOONG64_CODE: '{{.OVMF_LOONG64_CODE}}'
      CLOUDBOOT_OVMF_RISCV64_CODE: '{{.OVMF_RISCV64_CODE}}'
      CLOUDBOOT_OVMF_RISCV64_VARS: '{{.OVMF_RISCV64_VARS}}'
      CLOUDBOOT_BOOT_TIMEOUT: '{{.BOOT_TIMEOUT}}'
      # The multiarchboot package lives in this module, but a parent
      # go.work spanning the cloud-boot repos does not list it, so a
      # bare `go test` fails with "directory prefix ... does not
      # contain modules listed in go.work". Pin GOWORK=off so the test
      # resolves against this module regardless of the ambient go.work.
      GOWORK: 'off'
    cmds:
      # `go test -v` so the per-arch status table + the captured serial
      # banner on failure land in the operator's terminal. 6m total cap
      # = 4 arches * 60s + headroom.
      - '{{.GO}} test -v -timeout 6m -run TestMultiArchBoot ./pkg/multiarchboot/...'

  clean:
    cmds:
      - rm -rf bin *.iso .ovmf_vars*.fd
